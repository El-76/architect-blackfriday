name: sharding-repl-cache

services:
  config_server1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: config_server1
    restart: always
    networks:
      app-network:
        ipv4_address: 173.17.0.10
    volumes:
      - config1-data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
      ] 
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--port", "27019" ]
      interval: 5s
      start_period: 10s

  config_server2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: config_server2
    restart: always
    networks:
      app-network:
        ipv4_address: 173.17.0.15
    volumes:
      - config2-data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
      ] 
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--port", "27019" ]
      interval: 5s
      start_period: 10s

  config_server3:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: config_server3
    restart: always
    networks:
      app-network:
        ipv4_address: 173.17.0.16
    volumes:
      - config3-data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
      ] 
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--port", "27019" ]
      interval: 5s
      start_period: 10s

  init_mongo_cluster:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: init_mongo_cluster
    entrypoint: >
      bash -c "

      echo 'Waiting for the config server 1 to respond...';
      until mongosh --host config_server1 --port 27019 --eval 'db.adminCommand({ping:1})' &>/dev/null; do
        sleep 2;
      done;
      echo 'Waiting for the config server 2 to respond...';
      until mongosh --host config_server2 --port 27019 --eval 'db.adminCommand({ping:1})' &>/dev/null; do
        sleep 2;
      done;
       echo 'Waiting for the config server 2 to respond...';
      until mongosh --host config_server2 --port 27019 --eval 'db.adminCommand({ping:1})' &>/dev/null; do
        sleep 2;
      done;
      echo 'Initializing the replica set...';
      mongosh --host config_server1 --port 27019 --eval '
        rs.initiate({
          _id: \"config_server\",
          configsvr: true,
          version: 1,
          members: [
            { _id: 0, host: \"config_server1:27019\" },
            { _id: 1, host: \"config_server2:27019\" },
            { _id: 2, host: \"config_server3:27019\" }
          ]
        })
      ';
      echo 'Replica set configuration completed successfully!';

      echo 'Waiting for the shard1r1 server to respond...';
      until mongosh --host shard1r1 --port 27018 --eval 'db.adminCommand({ping:1})' &>/dev/null; do
        sleep 2;
      done;
      echo 'Waiting for the shard1r2 server to respond...';
      until mongosh --host shard1r2 --port 27018 --eval 'db.adminCommand({ping:1})' &>/dev/null; do
        sleep 2;
      done;
      echo 'Waiting for the shard1r3 server to respond...';
      until mongosh --host shard1r3 --port 27018 --eval 'db.adminCommand({ping:1})' &>/dev/null; do
        sleep 2;
      done;
      echo 'Initializing shard1...';
      mongosh --host shard1r1 --port 27018 --eval '
        rs.initiate({
          _id : \"shard1\",
          members: [
            { _id : 0, host : \"shard1r1:27018\" },
            { _id : 1, host : \"shard1r2:27018\" },
            { _id : 2, host : \"shard1r3:27018\" }
          ]
        })
      ';
      echo 'shard1 configuration completed successfully!';

      echo 'Waiting for the shard2r1 server to respond...';
      until mongosh --host shard2r1 --port 27018 --eval 'db.adminCommand({ping:1})' &>/dev/null; do
        sleep 2;
      done;
      echo 'Waiting for the shard2r2 server to respond...';
      until mongosh --host shard2r2 --port 27018 --eval 'db.adminCommand({ping:1})' &>/dev/null; do
        sleep 2;
      done;
      echo 'Waiting for the shard2r3 server to respond...';
      until mongosh --host shard2r3 --port 27018 --eval 'db.adminCommand({ping:1})' &>/dev/null; do
        sleep 2;
      done;
      echo 'Initializing shard2...';
      mongosh --host shard2r1 --port 27018 --eval '
        rs.initiate({
          _id : \"shard2\",
          members: [
            { _id : 0, host : \"shard2r1:27018\" },
            { _id : 1, host : \"shard2r2:27018\" },
            { _id : 2, host : \"shard2r3:27018\" }
          ]
        })
      ';
      echo 'shard2 configuration completed successfully!';

      echo 'Waiting for the router server 1 to respond...';
      until mongosh --host mongos_router1 --port 27017 --eval 'db.adminCommand({ping:1})' &>/dev/null; do
        sleep 2;
      done;
      echo 'Initializing shards...';
      mongosh --host mongos_router1 --port 27017 --eval '
        sh.addShard(\"shard1/shard1r1:27018,shard1r2:27018,shard1r3:27018\");
        sh.addShard(\"shard2/shard2r1:27018,shard2r2:27018,shard2r3:27018\");

        sh.enableSharding(\"somedb\");
        sh.shardCollection(\"somedb.helloDoc\", { \"name\" : \"hashed\" } )
      ';
      echo 'shards configuration completed successfully!';

      echo 'Waiting for the router server 2 to respond...';
      until mongosh --host mongos_router2 --port 27017 --eval 'db.adminCommand({ping:1})' &>/dev/null; do
        sleep 2;
      done;

      echo 'Cluster configuration completed successfully!';

      touch /var/run/cluster-init

      while true; do
        sleep 86400
      done

      "
    networks:
      app-network:
        ipv4_address: 173.17.0.12
    healthcheck:
      test: [ "CMD", "test", "-f", "/var/run/cluster-init" ]
      interval: 5s
      start_period: 10s
      retries: 500

  init_redis_cluster:
    image: dh-mirror.gitverse.ru/redis:latest
    container_name: init_redis_cluster
    entrypoint: >
      bash -c "

      echo 'Waiting for the redis1 server to respond...';
      until redis-cli -h redis1 ping; do
        sleep 2;
      done;
      echo 'Waiting for the redis2 server to respond...';
      until redis-cli -h redis2 ping; do
        sleep 2;
      done;
      echo 'Waiting for the redis3 server to respond...';
      until redis-cli -h redis3 ping; do
        sleep 2;
      done;
      echo 'Waiting for the redis4 server to respond...';
      until redis-cli -h redis4 ping; do
        sleep 2;
      done;
      echo 'Waiting for the redis5 server to respond...';
      until redis-cli -h redis5 ping; do
        sleep 2;
      done;
      echo 'Waiting for the redis6 server to respond...';
      until redis-cli -h redis6 ping; do
        sleep 2;
      done;

      echo 'Creating redis clister...';

      redis-cli --cluster create redis1:6379 redis2:6379 redis3:6379 redis4:6379 redis5:6379 redis6:6379 --cluster-replicas 1 --cluster-yes 2>&1;

      echo 'Cluster configuration completed successfully!';

      touch /var/run/cluster-init

      while true; do
        sleep 86400
      done

      "
    networks:
      app-network:
        ipv4_address: 173.17.0.20
    healthcheck:
      test: [ "CMD", "test", "-f", "/var/run/cluster-init" ]
      interval: 5s
      start_period: 10s
      retries: 500

  shard1r1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1r1
    restart: always
    networks:
      app-network:
        ipv4_address: 173.17.0.9
    volumes:
      - shard1r1-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard1",
        "--bind_ip_all",
      ]
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--port", "27018" ]
      interval: 5s
      start_period: 10s

  shard1r2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1r2
    restart: always
    networks:
      app-network:
        ipv4_address: 173.17.0.13
    volumes:
      - shard1r2-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard1",
        "--bind_ip_all",
      ]
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--port", "27018" ]
      interval: 5s
      start_period: 10s

  shard1r3:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1r3
    restart: always
    networks:
      app-network:
        ipv4_address: 173.17.0.18
    volumes:
      - shard1r3-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard1",
        "--bind_ip_all",
      ]
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--port", "27018" ]
      interval: 5s
      start_period: 10s

  shard2r1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2r1
    restart: always
    networks:
      app-network:
        ipv4_address: 173.17.0.8
    volumes:
      - shard2r1-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard2",
        "--bind_ip_all",
      ]
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--port", "27018" ]
      interval: 5s
      start_period: 10s

  shard2r2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2r2
    restart: always
    networks:
      app-network:
        ipv4_address: 173.17.0.14
    volumes:
      - shard2r2-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard2",
        "--bind_ip_all",
      ]
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--port", "27018" ]
      interval: 5s
      start_period: 10s

  shard2r3:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2r3
    restart: always
    networks:
      app-network:
        ipv4_address: 173.17.0.19
    volumes:
      - shard2r3-data:/data/db
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard2",
        "--bind_ip_all",
      ]
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--port", "27018" ]
      interval: 5s
      start_period: 10s
 
  mongos_router1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: mongos_router1
    restart: always
    networks:
      app-network:
        ipv4_address: 173.17.0.7
    command:
      [
        "mongos",
        "--configdb", 
        "config_server/config_server1:27019,config_server2:27019,config_server3:27019",
        "--bind_ip_all",
      ]
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--port", "27017" ]
      interval: 5s
      start_period: 10s
      retries: 500

  mongos_router2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: mongos_router2
    restart: always
    networks:
      app-network:
        ipv4_address: 173.17.0.17
    command:
      [
        "mongos",
        "--configdb", 
        "config_server/config_server1:27019,config_server2:27019,config_server3:27019",
        "--bind_ip_all",
      ]
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--port", "27017" ]
      interval: 5s
      start_period: 10s
      retries: 500

  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      mongos_router1:
        condition: service_healthy
      mongos_router2:
        condition: service_healthy
      init_mongo_cluster:
        condition: service_healthy
      init_redis_cluster:
        condition: service_healthy
      
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos_router1:27017,mongos_router2:27017"
      MONGODB_DATABASE_NAME: "somedb"
      REDIS_URL: "redis://redis1:6379"
    networks:
      app-network:
        ipv4_address: 173.17.0.11

  redis1:
    image: "dh-mirror.gitverse.ru/redis:latest"
    container_name: redis1
    volumes:
      - redis1:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    networks:
      app-network:
        ipv4_address: 173.17.0.32
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 30s
      timeout: 15s
      retries: 5

  redis2:
    image: "dh-mirror.gitverse.ru/redis:latest"
    container_name: redis2
    volumes:
      - redis2:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    networks:
      app-network:
        ipv4_address: 173.17.0.33
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 30s
      timeout: 15s
      retries: 5

  redis3:
    image: "dh-mirror.gitverse.ru/redis:latest"
    container_name: redis3
    volumes:
      - redis3:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    networks:
      app-network:
        ipv4_address: 173.17.0.34
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 30s
      timeout: 15s
      retries: 5

  redis4:
    image: "dh-mirror.gitverse.ru/redis:latest"
    container_name: redis4
    volumes:
      - redis4:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    networks:
      app-network:
        ipv4_address: 173.17.0.35
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 30s
      timeout: 15s
      retries: 5

  redis5:
    image: "dh-mirror.gitverse.ru/redis:latest"
    container_name: redis5
    volumes:
      - redis5:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    networks:
      app-network:
        ipv4_address: 173.17.0.36
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 30s
      timeout: 15s
      retries: 5

  redis6:
    image: "dh-mirror.gitverse.ru/redis:latest"
    container_name: redis6
    volumes:
      - redis6:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    networks:
      app-network:
        ipv4_address: 173.17.0.37
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 30s
      timeout: 15s
      retries: 5

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 173.17.0.0/16

volumes:
  config1-data:
  config2-data:
  config3-data:
  shard1r1-data:
  shard1r2-data:
  shard1r3-data:
  shard2r1-data:
  shard2r2-data:
  shard2r3-data:
  redis1:
  redis2:
  redis3:
  redis4:
  redis5:
  redis6:


